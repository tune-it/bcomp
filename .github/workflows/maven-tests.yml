name: Maven Verification

on:
  pull_request:
    branches:
      - v2-ng-master
  push:
    branches:
      - v2-ng-master
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Verify with Maven and Java 8
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Run Maven test suite
        run: mvn -B test

      - name: Publish JUnit test results
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        continue-on-error: true
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Maven Test Results
          include_passed: true
          require_tests: true
